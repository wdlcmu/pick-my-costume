<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storytime - Pick My Costume</title>
<meta name="description" content="Costumes as bedtime stories: watch and listen to every Pick My Costume idea as a story.">
<link rel="canonical" href="https://pickmycostume.com/storytime">
<script>
(function(){
  try {
    var m = /[?&]costume=([a-z0-9-]+)/.exec(location.search || "");
    var dest = "/?storytime" + (m ? "&costume=" + m[1] : "");
    location.replace(dest);
  } catch(e){}
})();
</script>
<style>body{font-family:system-ui,sans-serif;background:#0b0616;color:#f5efe4;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}a{color:#ffb35c;font-weight:700}</style>
</head>
<body>
<main style="text-align:center;padding:24px">
<h1>Storytime</h1>
<p>Taking you to the stories&hellip;</p>
<p><a href="/?storytime">Open storytime</a></p>
</main>
</body>
</html>
