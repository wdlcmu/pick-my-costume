var _tapGuards={};
function tapGuard(key,ms){var n=Date.now();if(n-(_tapGuards[key]||0)<ms)return false;_tapGuards[key]=n;return true;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

var grid=document.getElementById("grid"),seedlabel=document.getElementById("seedlabel");
var size=5,seed=null,cards=0;
function setSize(n){
  if(!tapGuard("bingo-size",400))return;
  size=n;seed=seedOfUrl()||randSeed();
  document.getElementById("btn4").setAttribute("aria-pressed",n===4?"true":"false");
  document.getElementById("btn5").setAttribute("aria-pressed",n===5?"true":"false");
  deal();
  ph("bingo_style_picked",{size:n});
}
function randSeed(){return Math.floor(Math.random()*1000000);}
function seedOfUrl(){var m=/[?&]seed=(\d+)/.exec(location.search||"");return m?parseInt(m[1],10):null;}
function deal(){
  cards++;
  var rng=mulberry32(seed);
  var pool=IDEAS.slice(),out=[];
  var need=size*size-(size===5?1:0);
  while(out.length<need&&pool.length){
    out.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
  }
  grid.className="grid s"+size;
  grid.innerHTML="";
  var k=0;
  for(var i=0;i<size*size;i++){
    var d=document.createElement("div");
    if(size===5&&i===12){
      d.className="sq free";
      d.innerHTML='<div class="em">\ud83c\udf83</div><div class="t">YOUR COSTUME</div>';
    }else{
      var e=out[k++%out.length];
      d.className="sq";d.setAttribute("data-id",e.id);
      d.innerHTML='<div class="em">'+esc(e.emoji)+'</div><div class="t">'+esc(e.title)+'</div>';

}
function renderPost(){

  document.getElementById("postpreview").value=t;
  document.getElementById("quizurl").textContent=quizUrl();
  var qrbox=document.getElementById("qr");qrbox.innerHTML="";
  try{
    if(typeof qrcode==="function"){
      var qr=qrcode(0,"M");qr.addData(quizUrl());qr.make();
      qrbox.innerHTML=qr.createSvgTag({cellSize:4,margin:0,scalable:true});
    }else{qrbox.textContent="QR unavailable";}
  }catch(err){qrbox.textContent="QR unavailable";}
}
document.getElementById("btn4").onclick=function(){setSize(4);};
document.getElementById("btn5").onclick=function(){setSize(5);};
document.getElementById("newcard").onclick=function(){
  if(!tapGuard("bingo-new",400))return;
  seed=randSeed();
  if(history.replaceState){try{history.replaceState(null,"","/bingo?seed="+seed);}catch(err){}}
  deal();
};
document.getElementById("printbtn").onclick=function(){
  if(!tapGuard("bingo-print",1000))return;
  ph("bingo_printed",{size:size,seed:seed});
  window.print();
};
document.getElementById("copybtn").onclick=function(){
  if(!tapGuard("bingo-copy",1000))return;
  var text=document.getElementById("postpreview").value;
  var done=function(){ph("bingo_copied",{size:size,seed:seed});};
  if(navigator.clipboard&&navigator.clipboard.writeText){

  }else{prompt("Copy this:",text);}
};

(function init(){

})();
