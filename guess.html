var IDEAS=GUESS_DATA.ideas, MAXG=GUESS_DATA.maxGuesses;
var byId={}; IDEAS.forEach(function(i){byId[i.id]=i;});
var params=new URLSearchParams(location.search||"");
var cid=(params.get("c")||"").trim();
var sid=(params.get("s")||"").trim();
var rawFrom=(params.get("from")||"").trim();
function cleanName(s){return /^[A-Za-z][A-Za-z .'-]{0,29}$/.test(s)?s:null;}
var fromName=cleanName(rawFrom);
function validSid(s){return /^[a-z0-9]{8,}$/.test(s);}
var app=document.getElementById("app");

/* ---------- shared: searchable pick list ---------- */
function searchBox(hitsEl,onPick){
  var q=el("input");q.type="search";q.id="q";q.placeholder="Type a costume name";q.autocomplete="off";
  var list=el("ul");list.id="hits";
  function render(){
    var v=q.value.trim().toLowerCase();list.innerHTML="";
    if(!v)return;
    var hits=IDEAS.filter(function(i){return i.title.toLowerCase().indexOf(v)>-1;}).slice(0,8);
    hits.forEach(function(i){
      var li=el("li",null,i.title);
      var a=el("span","aud",i.aud.replace(/,/g," / "));
      li.appendChild(a);
      li.addEventListener("click",function(){if(tapGuard("pick-"+i.id,400))onPick(i);});
      list.appendChild(li);
    });
    if(!hits.length){var li=el("li",null,"No matches. Try fewer letters.");list.appendChild(li);}
  }
  q.addEventListener("input",render);
  return {box:q,list:list};
}

/* ---------- recipient mode ---------- */
if(cid&&byId[cid]){
  var me=byId[cid];
  var who=fromName?fromName+"'s":"your friend's";
  app.appendChild(el("h1",null,"Can you guess "+who+" costume?"));
  var sub=el("p","sub","3 clues. 3 guesses. Then you find YOUR costume.");
  app.appendChild(sub);
  [["Clue 1",me.c1],["Clue 2",me.c2],["Clue 3",me.c3]].forEach(function(c){
    var d=el("div","clue");d.appendChild(el("b",null,c[0]));
    d.appendChild(document.createTextNode(c[1]));app.appendChild(d);
  });
  var left=MAXG, done=false;
  var att=el("p",null,"");att.id="attempts";att.textContent="Guesses left: "+left;app.appendChild(att);
  var msg=el("p","msg");app.appendChild(msg);
  var sb=searchBox(null,onGuess);
  app.appendChild(sb.box);app.appendChild(sb.list);
  function onGuess(i){
    if(done)return;
    ph("guess_attempt",{costume_id:cid,guess_id:i.id,n:MAXG-left+1,correct:i.id===cid,via_share_id:validSid(sid)?sid:undefined});
    if(i.id===cid){reveal(true);return;}
    left--;msg.className="msg wrong";
    msg.textContent="Nope, not the "+i.title+". "+(left>0?left+" "+(left===1?"guess":"guesses")+" left.":"That was your last guess.");
    att.textContent="Guesses left: "+Math.max(left,0);
    if(left<=0)reveal(false);
  }
  function reveal(won){
    done=true;sb.box.disabled=true;
    msg.className="msg right";
    msg.textContent=won?("You got it"+(MAXG-left===1?" on the first try":" in "+(MAXG-left)+" guesses")+"!"):"Out of guesses. Here is the answer.";
    ph("guess_reveal",{costume_id:cid,outcome:won?"solved":"ran_out",via_share_id:validSid(sid)?sid:undefined});
    var rv=el("div","card");rv.id="reveal";rv.style.display="block";
    var img=document.createElement("img");img.src="/images/og/"+cid+".jpg";img.alt=me.title;
    rv.appendChild(img);
    rv.appendChild(el("h1",null,me.title));
    var g=el("a","cta ghost","See the full costume guide");g.href="/c/"+cid+(validSid(sid)?"?s="+sid:"");
    rv.appendChild(g);
    var quiz=el("a","cta","Find YOUR costume: take the 2-minute quiz");
    var qs="?src="+encodeURIComponent(GUESS_DATA.src);
    if(validSid(sid))qs="/?s="+sid+"&src="+encodeURIComponent(GUESS_DATA.src);
    else qs="/?src="+encodeURIComponent(GUESS_DATA.src);
    quiz.href=qs+"&duel="+encodeURIComponent(cid);
    quiz.addEventListener("click",function(){if(tapGuard("quiz",400))ph("guess_quiz_clicked",{costume_id:cid,via_share_id:validSid(sid)?sid:undefined});});
    rv.appendChild(quiz);
    rv.appendChild(el("p","fine","The quiz takes 2 minutes. Your friend will want to know what you got."));
    app.appendChild(rv);
    try{if(rv.scrollIntoView)rv.scrollIntoView();}catch(e){}
  }
  ph("guess_view",{costume_id:cid,via_share_id:validSid(sid)?sid:undefined});
}else{
/* ---------- sender mode ---------- */
  if(cid)app.appendChild(el("p","msg wrong","That guess link looks broken, so here is the sender side. Pick your costume to make a fresh dare."));
  app.appendChild(el("h1",null,"Dare them to guess"));
  app.appendChild(el("p","sub","Pick your costume, get a mystery link with 3 clues. Your friend gets 3 guesses, then the quiz."));
  var picked=null;
  var sb2=searchBox(null,function(i){
    picked=i;
    pk.textContent="Your costume: "+i.title;
    buildText();
    ph("guess_pick_set",{costume_id:i.id});
  });
  app.appendChild(sb2.box);app.appendChild(sb2.list);
  var pk=el("p","msg");app.appendChild(pk);
  var nm=el("input");nm.type="text";nm.id="senderName";nm.placeholder="Your first name (optional)";nm.maxLength=30;
  nm.addEventListener("input",buildText);
  app.appendChild(nm);
  var ta=el("textarea");ta.readOnly=true;ta.placeholder="Pick your costume above to preview the dare text.";app.appendChild(ta);
  var cp=el("button",null,"Copy the dare");cp.id="copyBtn";
  var status=el("p","status");status.id="copyStatus";
  function mintSid(){var s="";var abc="abcdefghijklmnopqrstuvwxyz0123456789";for(var k=0;k<8;k++)s+=abc[Math.floor(Math.random()*abc.length)];return s;}
  var mySid=mintSid();
  function buildText(){
    if(!picked){ta.value="";return;}
    var name=cleanName(nm.value.trim());
    var link=GUESS_DATA.site+"/guess.html?c="+picked.id+"&s="+mySid+(name?"&from="+encodeURIComponent(name):"");
    ta.value="I took a 2-minute quiz and it picked my Halloween costume. 3 clues, 3 guesses. Can you guess mine? Then take the quiz and tell me what you get: "+link;
  }
  function doCopy(){
    if(!picked||!tapGuard("copy",1000))return;
    var t=ta.value;
    function done(ok){
      status.textContent=ok?"Copied. Paste it into a text or group chat.":"Copy failed. Long-press the text above to copy it by hand.";
      if(ok)ph("share_created",{share_id:mySid,idea_id:picked.id,share_origin:"guess",share_msg_variant:"guess-v1"});
      ph("guess_share_copied",{costume_id:picked.id,via:"clipboard",ok:ok});
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){done(true);},function(){done(false);});
    }else{
      ta.select();try{done(document.execCommand("copy"));}catch(e){done(false);}
    }
  }
  cp.addEventListener("click",doCopy);
  app.appendChild(cp);app.appendChild(status);
  app.appendChild(el("p","fine","Staged experiment page. Your friend sees clues and a guess box, never the answer, until they solve it or run out of guesses."));
}
</script>
