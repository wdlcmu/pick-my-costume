          <svg class="costume" data-id="dinosaur" viewBox="0 0 300 300" role="img" aria-label="A child dressed as a dinosaur"><path d="M72 288V105q2-73 77-73 72 0 80 64l28 28-31 5v159Z" fill="#67b96b" stroke="#26223a" stroke-width="7"/><path d="m88 63-29-22 41-6m45 2-17-34 39 14m38 31 15-34 20 34" fill="#ffbd2e" stroke="#26223a" stroke-width="7" stroke-linejoin="round"/><circle cx="167" cy="88" r="7"/><circle cx="215" cy="108" r="5"/><path d="M115 137h74" stroke="#26223a" stroke-width="6" stroke-linecap="round"/><circle cx="136" cy="174" r="35" fill="#e9a56c" stroke="#26223a" stroke-width="7"/><circle cx="124" cy="170" r="5"/><circle cx="149" cy="170" r="5"/></svg>

        <h2 class="match-title">Match the pieces</h2>
        <p class="match-prompt" id="matchPrompt">Tap a piece, then its costume.</p>

          <svg class="match-lines" id="matchLines" aria-hidden="true"></svg>
          <div class="match-row" id="pieceRow" aria-label="Costume pieces"></div>
          <div class="match-row" id="costumeRow" aria-label="Costumes"></div>

      </section>

      <section class="screen finish" id="finish">
        <h2 id="finishTitle">Costume star!</h2>

  <div class="confetti" id="confetti" aria-hidden="true"></div>
<script>
(function(){
  var peekRounds=[
    {id:'witch',name:'Witch',level:'easy',label:'Easy peek',choices:['Witch','Friendly Ghost','Astronaut']},
    {id:'pirate',name:'Pirate',level:'tricky',label:'Trickier',choices:['Robot','Pirate','Dinosaur']},
    {id:'robot',name:'Robot',level:'super',label:'Super sleuth',choices:['Astronaut','Friendly Ghost','Robot']}
  ];
  var looks={
    'little-pumpkin':{name:'Little Pumpkin',image:'images/play/little-pumpkin.webp',guide:'https://pickmycostume.com/c/little-pumpkin'},
    'bumblebee':{name:'Bumble Bee',image:'images/play/bumblebee.webp',guide:'https://pickmycostume.com/c/bumble-bee'},
    'baby-dino':{name:'Baby Dinosaur',image:'images/play/baby-dino.webp',guide:'https://pickmycostume.com/c/baby-dino'},
    'friendly-ghost':{name:'Friendly Ghost',image:'images/play/friendly-ghost.webp',guide:'https://pickmycostume.com/c/friendly-ghost'},
    'little-witch':{name:'Little Witch',image:'images/play/little-witch.webp',guide:'https://pickmycostume.com/c/little-witch'},
    'tiny-astronaut':{name:'Tiny Astronaut',image:'images/play/tiny-astronaut.webp',guide:'https://pickmycostume.com/c/tiny-astronaut'}
  };
  var matchRounds=[
    {label:'Easy matches',featured:'little-pumpkin',pairs:[
      {id:'stem',label:'Pumpkin stem',type:'stem',to:'little-pumpkin'},
      {id:'antennae',label:'Bee antennae',type:'headband',to:'bumblebee'},
      {id:'dino-tail',label:'Dinosaur tail',type:'tail',to:'baby-dino'}]},
    {label:'Look closer',featured:'friendly-ghost',pairs:[
      {id:'poncho',label:'White poncho',type:'poncho',to:'friendly-ghost'},
      {id:'witch-hat',label:'Pointy hat',type:'hat',to:'little-witch'},
      {id:'mission-patch',label:'Mission patch',type:'patch',to:'tiny-astronaut'}]},
    {label:'Super matcher',featured:'tiny-astronaut',pairs:[
      {id:'white-fabric',label:'White fabric',type:'fabric-white',to:'friendly-ghost'},
      {id:'silver-tape',label:'Silver tape',type:'tape',to:'tiny-astronaut'},
      {id:'black-fabric',label:'Black fabric',type:'fabric-black',to:'little-witch'}]}
  ];
  var round=0,points=0,soundOn=true,answered=false,audio=null,mode='peek',selectedPiece=null,matchedCount=0;
  var intro=document.getElementById('intro'),game=document.getElementById('game'),materials=document.getElementById('materials'),finish=document.getElementById('finish');
  var hud=document.getElementById('hud'),progressWrap=document.getElementById('progressWrap'),stage=document.getElementById('stage'),answers=document.getElementById('answers');
  var pieceRow=document.getElementById('pieceRow'),costumeRow=document.getElementById('costumeRow'),matchLines=document.getElementById('matchLines');
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function tone(freq,dur,delay){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.0001,audio.currentTime+delay);g.gain.exponentialRampToValueAtTime(.13,audio.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+delay+dur);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+dur+.02)}catch(e){}}
  function setScreen(el){[intro,game,materials,finish].forEach(function(x){x.classList.toggle('active',x===el)})}
  function resetRun(){round=0;points=0;document.getElementById('score').textContent='0';hud.hidden=false;progressWrap.hidden=false}
  function setHud(label,total){document.getElementById('roundLabel').textContent='Round '+(round+1)+' of '+total+' · '+label;document.getElementById('progress').style.width=(round/total*100)+'%'}
  function start(){mode='peek';resetRun();setScreen(game);renderPeek()}
  function startMaterials(){mode='match';resetRun();setScreen(materials);renderMatch()}
  function renderPeek(){
    answered=false;var item=peekRounds[round];
    stage.className='stage level-'+item.level;
    document.querySelectorAll('.costume').forEach(function(x){x.classList.toggle('show',x.getAttribute('data-id')===item.id)});
    setHud(item.label,peekRounds.length);
    document.getElementById('feedback').innerHTML='';document.getElementById('next').classList.remove('show');document.getElementById('peek').style.display='block';answers.innerHTML='';
    shuffle(item.choices.slice()).forEach(function(name){var b=document.createElement('button');b.className='answer';b.textContent=name;b.disabled=true;b.addEventListener('click',function(){guessPeek(b,name,item)});answers.appendChild(b)});
  }
  function openCurtain(){stage.classList.add('peeked');document.getElementById('peek').style.display='none';Array.prototype.forEach.call(answers.children,function(b){b.disabled=false});tone(420,.12,0);tone(620,.16,.08)}
  function guessPeek(button,name,item){
    if(answered)return;
    if(name!==item.name){button.classList.add('wrong');button.disabled=true;document.getElementById('feedback').innerHTML='<strong>Try again!</strong><span>Take another look through the curtain.</span>';tone(330,.13,0);setTimeout(function(){button.classList.remove('wrong');button.disabled=false},520);return}
    answered=true;points++;stage.classList.add('solved');document.getElementById('score').textContent=points;
    Array.prototype.forEach.call(answers.children,function(b){b.disabled=true;if(b.textContent===item.name)b.classList.add('correct')});
    document.getElementById('feedback').innerHTML='<strong>You got it!</strong><span>That’s the '+item.name+'.</span>';document.getElementById('next').classList.add('show');tone(523,.15,0);tone(659,.15,.12);tone(784,.23,.24);
  }
  function iconSvg(type){
    var paths={
      stem:'<path d="M12 11V4q0-2 2-2h2"/><path d="M12 8Q7 4 4 8q4 5 8 3Z" fill="#67b96b"/><path d="M12 10Q17 6 20 10q-4 5-8 3Z" fill="#67b96b"/>',
      headband:'<path d="M5 20Q6 8 12 8t7 12"/><path d="M8 9 6 3M16 9l2-6"/><circle cx="5.5" cy="3" r="2" fill="#ffbd2e"/><circle cx="18.5" cy="3" r="2" fill="#ffbd2e"/>',
      tail:'<path d="M4 6q12 0 13 10 0 3 3 4-8 2-10-5Q8 10 4 6Z" fill="#67b96b"/><path d="m8 8-3 3m7 1-3 3"/>',
      poncho:'<path d="m12 3 9 17H3Z" fill="#fff"/><circle cx="12" cy="7" r="2"/><path d="M7 16h10"/>',
      hat:'<path d="m7 17 6-14 5 14Z" fill="#4b3475"/><path d="M3 18h18"/>',
      patch:'<path d="m12 3 3 3 4 .5-.5 4 2 3.5-3.5 2-1.5 4-3.5-2-3.5 2L7 16l-3.5-2 2-3.5-.5-4L9 6Z" fill="#cbd9e7"/><path d="m12 8 1.3 2.6 2.9.4-2.1 2 .5 2.9-2.6-1.4-2.6 1.4.5-2.9-2.1-2 2.9-.4Z"/>',
      tape:'<circle cx="11" cy="11" r="7" fill="#cbd9e7"/><circle cx="11" cy="11" r="3" fill="var(--surface)"/><path d="M16 16h5v5h-8" fill="#cbd9e7"/>',
      'fabric-white':'<path d="M5 5h13l1 13H6Z" fill="#fff"/><path d="m8 5 1 13M14 5l1 13M6 12h13"/>',
      'fabric-black':'<path d="M5 5h13l1 13H6Z" fill="#3d3848"/><path d="m8 5 1 13M14 5l1 13M6 12h13" stroke="#fff"/>'
    };
    return '<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[type]+'</svg>';
  }
  function renderMatch(){
    var item=matchRounds[round];matchedCount=0;selectedPiece=null;setHud(item.label,matchRounds.length);
    document.getElementById('matchPrompt').textContent=round===0?'Tap a piece, then its costume.':round===1?'The clues are getting smaller.':'Look closely — two costumes look alike.';
    document.getElementById('materialFeedback').innerHTML='';document.getElementById('matchDone').hidden=true;matchLines.innerHTML='';pieceRow.innerHTML='';costumeRow.innerHTML='';
    shuffle(item.pairs.slice()).forEach(function(pair){var b=document.createElement('button');b.className='piece-card';b.setAttribute('data-match',pair.to);b.setAttribute('aria-label',pair.label);b.innerHTML=iconSvg(pair.type)+'<span>'+pair.label+'</span>';b.addEventListener('click',function(){choosePiece(b)});pieceRow.appendChild(b)});
    var targets=shuffle(item.pairs.map(function(pair){return pair.to}));targets.forEach(function(id){var look=looks[id],b=document.createElement('button');b.className='costume-card';b.setAttribute('data-match',id);b.innerHTML='<img src="'+look.image+'" alt="'+look.name+' costume"><span>'+look.name+'</span>';b.addEventListener('click',function(){chooseCostume(b)});costumeRow.appendChild(b)});
    document.getElementById('guideLink').href=looks[item.featured].guide;
  }
  function choosePiece(button){
    if(button.classList.contains('matched'))return;
    Array.prototype.forEach.call(pieceRow.children,function(b){b.classList.remove('selected')});selectedPiece=button;button.classList.add('selected');document.getElementById('materialFeedback').innerHTML='<span>Now tap the costume it belongs to.</span>';tone(500,.08,0);
  }
  function chooseCostume(button){
    if(button.classList.contains('matched'))return;
    if(!selectedPiece){document.getElementById('materialFeedback').innerHTML='<strong>Pick a piece first.</strong><span>Then choose its costume.</span>';return}
    if(selectedPiece.getAttribute('data-match')!==button.getAttribute('data-match')){
      selectedPiece.classList.add('shake');button.classList.add('shake');document.getElementById('materialFeedback').innerHTML='<strong>Try again!</strong><span>That piece belongs with a different costume.</span>';tone(330,.12,0);setTimeout(function(){selectedPiece&&selectedPiece.classList.remove('shake');button.classList.remove('shake')},430);return;
    }
    var piece=selectedPiece;piece.classList.remove('selected');piece.classList.add('matched');piece.disabled=true;button.classList.add('matched');button.disabled=true;selectedPiece=null;matchedCount++;drawLink(piece,button);tone(523,.12,0);tone(700,.18,.1);
    document.getElementById('materialFeedback').innerHTML='<strong>That’s a match!</strong><span>'+matchedCount+' of 3 connected.</span>';
    if(matchedCount===3){points++;document.getElementById('score').textContent=points;document.getElementById('materialFeedback').innerHTML='<strong>Round matched!</strong><span>Every piece found its costume.</span>';document.getElementById('matchDone').hidden=false;tone(784,.18,.18)}
  }
  function drawLink(piece,costume){
    var board=document.getElementById('matchBoard'),br=board.getBoundingClientRect(),pr=piece.getBoundingClientRect(),cr=costume.getBoundingClientRect();matchLines.setAttribute('viewBox','0 0 '+br.width+' '+br.height);var line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',pr.left-br.left+pr.width/2);line.setAttribute('y1',pr.bottom-br.top-4);line.setAttribute('x2',cr.left-br.left+cr.width/2);line.setAttribute('y2',cr.top-br.top+4);matchLines.appendChild(line);
  }
  function next(){round++;if(mode==='match'){if(round<matchRounds.length)renderMatch();else showFinish()}else{if(round<peekRounds.length)renderPeek();else showFinish()}}
  function showFinish(){
    hud.hidden=true;progressWrap.hidden=true;setScreen(finish);document.getElementById('result').textContent=mode==='match'?'You matched all 3 rounds':'You found 3 out of 3';document.getElementById('finishTitle').textContent='Costume star!';document.getElementById('finishCopy').textContent=mode==='match'?'Every piece found its costume.':'Easy peek to super sleuth — you spotted them all.';burst();tone(523,.15,0);tone(659,.15,.13);tone(784,.18,.26);tone(1047,.35,.39);
  }
  function burst(){var box=document.getElementById('confetti'),colors=['#f16c3b','#ffbd2e','#167f7b','#4c8fdb','#e95e8d'];box.innerHTML='';for(var i=0;i<34;i++){var p=document.createElement('i');p.style.left=(5+Math.random()*90)+'%';p.style.background=colors[i%colors.length];p.style.setProperty('--drift',(Math.random()*180-90)+'px');p.style.animationDelay=(Math.random()*.45)+'s';box.appendChild(p)}setTimeout(function(){box.innerHTML=''},2600)}
  document.getElementById('start').addEventListener('click',start);
  document.getElementById('startMaterials').addEventListener('click',startMaterials);
  document.getElementById('peek').addEventListener('click',openCurtain);
  document.getElementById('next').addEventListener('click',next);
  document.getElementById('materialNext').addEventListener('click',next);
  document.getElementById('again').addEventListener('click',function(){mode==='match'?startMaterials():start()});
  document.getElementById('sound').addEventListener('click',function(){soundOn=!soundOn;this.textContent=soundOn?'Sound on':'Sound off';this.setAttribute('aria-pressed',soundOn?'true':'false');if(soundOn)tone(600,.15,0)});
})();
</script>

<script>
/* 2026-09-28 Play tab: minimal game analytics. Guarded so ad-blockers never break play. */
(function(){
  function cap(name, props){
    try { if (window.posthog && posthog.capture) posthog.capture(name, props || {}); } catch(e){}
  }
  var curMode = '';
  document.addEventListener('DOMContentLoaded', function(){
    var s1 = document.getElementById('start'), s2 = document.getElementById('startMaterials');
    if (s1) s1.addEventListener('click', function(){ curMode='peek'; cap('play_started', {mode:'peek'}); });
    if (s2) s2.addEventListener('click', function(){ curMode='match'; cap('play_started', {mode:'match'}); });
    var fin = document.getElementById('finish');
    if (fin && window.MutationObserver) {
      var fired = false;
      new MutationObserver(function(){
        if (!fired && fin.classList.contains('active')) {
          fired = true;
          var sc = document.getElementById('score');
          cap('play_completed', {mode: curMode, stars: sc ? sc.textContent : ''});
        }
      }).observe(fin, {attributes:true, attributeFilter:['class']});
    }
    var again = document.getElementById('again');
    if (again) again.addEventListener('click', function(){ fired = false; });
  });
})();
</script>
